[workspace]
resolver = "3"
members = ["."]

[package]
name = "ai-router"
description = "The router of the ai plugin: an app service that maps tasks to models, calls providers and records usage (plugins/ai)."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "ai_router"
doctest = false

[[bin]]
name = "crow-ai-router"
path = "src/main.rs"
test = false

[dependencies]
rookery-proto = { path = "../../../.deps/rookery/crates/rookery-proto" }
base64 = "0.22"
bytes = "1"
futures = "0.3"
jsonschema = { version = "0.61", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
anyhow = "1"
tokio-stream = "0.1"

[profile.dev]
debug = "line-tables-only"
