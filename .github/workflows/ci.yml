name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Sync pinned cross-repo dependencies
        run: bun run sync-deps
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, test, and build
        run: bun run check
